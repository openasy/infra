# Infrastructure and one infra-agent. The agent reads hosts over SSH and keeps the SSH certificate authority; nothing
# is installed on the hosts (ADR 0018, 0031). Add more agents in other networks from Settings, Agents.
#
#   openssl rand -hex 32 > openasy-kek         # Infrastructure's key: cluster tokens, sign-in secrets (ADR 0021)
#   openssl rand -hex 32 > openasy-agent-kek   # the agent's key: its SSH CA and keys. Keep both with your backups
#   docker compose up -d infra
#   docker compose logs infra | grep 'no owner yet'   # the one-time link that creates the owner account
#   # Settings, Agents, Add agent, then:
#   INFRA_ENROLL_TOKEN=oie_... docker compose up -d infra-agent
services:
  infra:
    image: ghcr.io/openasy/infra:0.5.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - infra-data:/data # SQLite database: agents, hosts, clusters, collections and changes
      # - ./inventory:/config/inventory:ro   # the install's servers, shared with Logs
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open Infrastructure at; with a TLS proxy in front, its https:// URL.
      INFRA_PUBLIC_URL: ${INFRA_PUBLIC_URL:-http://localhost:8080}
      # Hosts from the hosts file, the same file Logs reads (ADR 0052):
      # OPENASY_HOSTS: /config/inventory/hosts.yaml
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: infra
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

  infra-agent:
    image: ghcr.io/openasy/infra-agent:0.5.0 # always the same version as infra
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp] # SSH keys and certificates for one connection; never on a volume
    volumes:
      - infra-agent-data:/data # its CA, fixed key and secret, sealed with its own key
    secrets:
      - source: openasy-agent-kek
        target: openasy-agent-kek # mounted at /run/secrets/openasy-agent-kek
    environment:
      INFRA_URL: http://infra:8080
      # One-time, from Settings, Agents; only needed for the first start.
      INFRA_ENROLL_TOKEN: ${INFRA_ENROLL_TOKEN:-}
    depends_on:
      - infra

volumes:
  infra-data:
  infra-agent-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
  openasy-agent-kek:
    file: ./openasy-agent-kek
