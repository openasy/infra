# What the Setup page asks admins to add. The CA is trusted only for the principals listed per account, so it can
# never log in as root or anyone else.
TrustedUserCAKeys /etc/ssh/openasy_ca.pub
AuthorizedPrincipalsFile /etc/ssh/principals/%u
Match User openasy
  PasswordAuthentication no
  AllowTcpForwarding no
  AllowAgentForwarding no
  AllowStreamLocalForwarding no
  X11Forwarding no
  PermitTTY no
